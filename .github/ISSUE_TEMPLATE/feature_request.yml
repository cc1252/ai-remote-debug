name: 功能建议
description: 建议一个新能力或改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景
      description: 请先描述要解决的问题，而不只是实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: 权限与安全影响
      description: 是否增加可执行命令、数据访问、联网或凭据存储范围？
    validations:
      required: true
